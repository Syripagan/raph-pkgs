[package]
name = "itstool"
version = "2.0.7"
description = "Itstool extracts messages from XML files and outputs PO template files, then merges translations from MO files to create translated XML files"
source = "https://files.itstool.org/itstool/itstool-2.0.7.tar.bz2"

[build]
system = "manual"
build_commands = "sed -i 's/re.sub(/re.sub(r/' itstool.in && sed -i 's/re.compile(/re.compile(r/' itstool.in && PYTHON=/usr/bin/python3 ./configure --prefix=/usr && make"
install_command = "make install"
depends = "docbook-xml,libxml2"
