[package]
name = "hello"
version = "2.12.1"
description = "Tests with this package"
source = "https://ftp.gnu.org/gnu/hello/hello-2.12.1.tar.gz"

[build]
system = "manual"
build_commands = [
	'./configure',
	'make'
]
install_command = [
	'make install',
	'mkdir $DESTDIR/usr/bin -p',
	'mv $DESTDIR/usr/local/bin/hello $DESTDIR/usr/bin/hallobro'
]
depends = ""
