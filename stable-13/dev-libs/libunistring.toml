[package]
name = "libunistring"
version = "1.4.2"
description = "libunistring is a library that provides functions for manipulating Unicode and C strings"
source = "https://ftp.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.gz"

[build]
system = "autotools"
configure_args = [
	"--disable-static", 
	"--docdir=/usr/share/doc/libunistring-1.4.2"
]
