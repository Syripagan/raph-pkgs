[package]
name = "libxml2"
version = "2.15.3"
description = "The libxml2 package contains libraries and utilities used for parsing XML files"
source = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.3.tar.xz"

[build]
system = "manual"
build_commands = [
	"mkdir build",
	"meson setup build --prefix=/usr --buildtype=release -D history=enabled -D python=enabled -D docs=disabled",
	"ninja -C build -j$RAD_MAKEOPTS"
]
install_command = [
	"DESTDIR=$DESTDIR ninja -C build install",
	"sed \"s/--static/--shared/\" -i $DESTDIR/usr/bin/xml2-config",
	"ln -sf libxml2.so.16.1.3 $DESTDIR/usr/lib/libxml2.so.2"
]
depends = "doxygen"
