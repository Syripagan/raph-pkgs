[package]
name = "libsass"
version = "3.6.6"
description = "Libsass, a CSS pre-processor language"
source = "https://github.com/sass/libsass/archive/3.6.6/libsass-3.6.6.tar.gz"

[build]
system = "manual"
build_commands = "autoreconf -fi && ./configure --prefix=/usr && make -j$RAD_CORES"
install_command = "make install"
