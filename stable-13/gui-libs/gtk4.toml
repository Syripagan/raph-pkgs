[package]
name = "gtk4"
version = "4.18.6"
description = "The GTK 4 package contains libraries used for creating graphical user interfaces for applications"
source = "https://download.gnome.org/sources/gtk/4.18/gtk-4.18.6.tar.xz"

[build]
system = "manual"
build_commands = "sed -e '939 s/= { 0, }//' -e '940 a memset (&transform, 0, sizeof(GtkCssTransform));' -i gtk/gtkcsstransformvalue.c && mkdir build && meson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -D broadway-backend=true -D introspection=enabled -D vulkan=enabled && ninja -C build -j$RAD_CORES"
install_command = "ninja -C build install"
depends = "graphene,glslc"
