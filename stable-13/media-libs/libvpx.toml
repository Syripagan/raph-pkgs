[package]
name = "libvpx"
version = "1.16.0"
description = "This package, from the WebM project, provides the reference implementations of the VP8 Codec (used in most current HTML5 video) and of the next-generation VP9 Codec"
source = "https://github.com/webmproject/libvpx/archive/v1.16.0/libvpx-1.16.0.tar.gz"

[build]
system = "manual"
build_commands = "wget https://www.linuxfromscratch.org/patches/blfs/svn/libvpx-1.16.0-security_fix-1.patch && find -type f | xargs touch && patch -Np1 -i ./libvpx-1.16.0-security_fix-1.patch && sed -i 's/cp -p/cp/' build/make/Makefile && mkdir libvpx-build && sh -c 'cd libvpx-build; ../configure --prefix=/usr --enable-shared --disable-static; make -j$RAD_CORES'"
install_command = "make -C libvpx-build install DIST_DIR=$DESTDIR/usr"
