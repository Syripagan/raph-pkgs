[package]
name = "bash-completion"
version = "2.17.0"
description = "bash-completion is a collection of command line command completions for the Bash shell"
source = "https://github.com/scop/bash-completion/archive/refs/tags/2.17.0.tar.gz"

[build]
system = "manual"
build_commands = "autoreconf -i && ./configure --target=release && make -j$RAD_MAKEOPTS"
install_command = "make install"
