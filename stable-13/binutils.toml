[package]
name = "binutils"
version = "2.46.0"
description = "The Binutils package contains a linker, an assembler, and other tools for handling object files"
source = "https://sourceware.org/pub/binutils/releases/binutils-2.46.0.tar.xz"

[build]
system = "autotools"
multilib_support = false
configure_args = "--sysconfdir=/etc --enable-ld=default --enable-plugins --enable-shared --disable-werror --enable-64-bit-bfd --enable-new-dtags --with-system-zlib --enable-default-hash-style=gnu"
