[package]
name = "freetype"
version = "2.14.3"
source = "https://downloads.sourceforge.net/freetype/freetype-2.14.3.tar.xz"
description = "This package contains a library which allows applications to properly render TrueType fonts"

[build]
system = "manual"
build_commands = "sed -ri 's:.*(AUX_MODULES.*valid):\1:' modules.cfg && sed -r 's:.*(#.*SUBPIXEL_RENDERING) .*:\1:' -i include/freetype/config/ftoption.h && ./configure --prefix=/usr --disable-static --enable-freetype-config --with-harfbuzz=dynamic && make"
install_command = "make install"
depends = "harfbuzz"
